[workspace]
resolver = "2"
members = [
    "crates/trft-core",
    "crates/trft-cli",
    "crates/trft-server",
    "crates/trft-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
