[package]
name = "trft-gui"
version.workspace = true
edition.workspace = true
description = "TrFileTransfer v2 桌面 GUI（Tauri 2：托盘/主题/双语/拖放/进度卡片）"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde.workspace = true
serde_json = "1"
tokio.workspace = true
trft-core = { version = "0.1.0", path = "../trft-core" }
trft-server = { version = "0.1.0", path = "../trft-server" }
axum = "0.8"
socket2 = "0.6"
# QR 只用编码核（default-features=false 零依赖），SVG 由本 crate 自行拼装。
qrcode = { version = "0.14", default-features = false }
if-addrs = "0.13"

[target.'cfg(windows)'.dependencies]
# WebView2 运行时检测（规格 §8.2：缺失环境引导安装）+ HKCU Run 开机自启。
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Power"] }
